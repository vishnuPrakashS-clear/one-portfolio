name: Idea or request
description: Suggest a new screen, statement format or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The job you're trying to get done, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: format
    attributes:
      label: Statement format (if this is about a new upload)
      description: Which broker or depository, and file type (PDF, Excel, CSV). Don't attach a real statement.
