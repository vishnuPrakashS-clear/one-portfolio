# Weekly dependency updates, grouped so they arrive as a few pull requests rather than dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns: ["three", "@types/three", "@react-three/*"]
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["eslint", "prettier*", "typescript", "vitest", "tailwindcss", "@tailwindcss/*", "postcss", "@types/node"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
